[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abudhabi-mobility-ribbon"
version = "0.1.0"
description = "Abu Dhabi mobility insight ribbon for monochrome e-paper PNG rendering."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10.4.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.2",
  "typer>=0.12.3",
  "pytest>=8.3.2",
  "feedparser>=6.0.11",
  "playwright>=1.45.0",
  "tzdata>=2025.2",
]

[project.scripts]
mobility-ribbon = "ribbon.cli.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
